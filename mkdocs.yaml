      - 어떻게 사용할 수 있나요?: introduction/how-to-use.md
      - 에이전트 UI 생태계: introduction/agent-ui-ecosystem.md
  - 퀵스타트: quickstart.md
  - A2UI Composer ⭐:
      - composer/index.md
      - Composer 연동: composer/composer_renderer_integration.md
  - 개념:
      - 개요: concepts/overview.md
      - 용어집: concepts/glossary.md
      - 데이터 흐름: concepts/data-flow.md
      - 컴포넌트 및 구조: concepts/components.md
      - 데이터 바인딩: concepts/data-binding.md
      - 카탈로그: concepts/catalogs.md
      - 전송 계층: concepts/transports.md
      - 액션: concepts/actions.md
  - 개발자 가이드:
      - 클라이언트 설정: guides/client-setup.md
      - 에이전트 개발: guides/agent-development.md
      - 모든 에이전트 프레임워크 및 하니스에서 A2UI 사용: guides/a2ui-with-any-agent-framework.md
      - 렌더러 개발: guides/renderer-development.md
      - 나만의 카탈로그 정의: guides/defining-your-own-catalog.md
      - 커스텀 컴포넌트 작성: guides/authoring-components.md
      - 테마 및 스타일링: guides/theming.md
      - A2UI + MCP:
          - MCP 위의 A2UI: guides/a2ui_over_mcp.md
          - A2UI 안의 MCP 앱: guides/mcp-apps-in-a2ui.md
          - MCP 앱 안의 A2UI: guides/a2ui-in-mcp-apps.md
